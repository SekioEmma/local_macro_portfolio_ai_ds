yfinance_history:
  index_unofficial_fallback:
    - metric_key: sp500
      symbol: "^GSPC"
      display_name: "S&P 500 Index"
      source_badge: unofficial_fallback
      metric_kind: index
      unit: index
      enabled: true
      interpretation_hint: "Yahoo Finance index history used as an unofficial fallback; not an official current value."
    - metric_key: nasdaq
      symbol: "^IXIC"
      display_name: "Nasdaq Composite Index"
      source_badge: unofficial_fallback
      metric_kind: index
      unit: index
      enabled: true
      interpretation_hint: "Yahoo Finance Nasdaq Composite history used as an unofficial fallback; not an official current value."
