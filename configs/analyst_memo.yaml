analyst_memo:
  default_provider: deepseek-pro
  context_mode: sanitized
  output_dir: outputs/analyst_memos
  save_markdown: true
  save_json: true
  require_human_review: true
  allow_trade_instructions: false
  prompt_preview_chars: 1200
  deepseek:
    model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.2
    max_tokens: 5000
    timeout_seconds: 180
